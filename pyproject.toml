[project]
name = "hueyos"
version = "0.2.0"
description = "HueyOS: offline-first embodied AI / OS for Huey and the Monkey-Head-Project."
requires-python = ">=3.13,<3.15"
readme = "README.md"
authors = [
  { name = "Dylan L. R. Pollock" },
]
license = { text = "GPL-3.0-only" }
keywords = [
  "hueyos",
  "huey",
  "monkey-head-project",
  "robotics",
  "agent",
  "ai",
  "offline-first",
  "embodied-ai",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: POSIX :: Linux",
]

# Keep the on-robot footprint small; full stack is available via extras.
dependencies = [
  "aiofiles==25.1.0",
  "aiohttp==3.13.4",
  "aiosqlite==0.22.1",
  "anyio==4.12.1",
  "attrs==26.1.0",
  "certifi==2026.2.25",
  "cryptography==46.0.7",
  "evdev==1.9.3; sys_platform == 'linux'",
  "fastapi==0.135.1",
  "orjson==3.11.7",
  "packaging==26.0",
  "psutil==7.2.2",
  "pydantic==2.12.5",
  "pydantic-settings==2.13.1",
  "PyYAML==6.0.3",
  "python-multipart==0.0.22",
  "requests==2.33.0",
  "sse-starlette==3.3.2",
  "starlette==1.0.0",
  "typing-extensions==4.15.0",
  "uvicorn[standard]==0.41.0; sys_platform != 'emscripten'",
]

[project.urls]
Homepage = "https://www.dlrp.ca"
Repository = "https://github.com/DylanLRPollock/Monkey-Head-Project"
Issues = "https://github.com/DylanLRPollock/Monkey-Head-Project/issues"

