[project]
name = "hueyos"
version = "0.2.0"
description = "HueyOS: offline-first embodied AI / OS for Huey and the Monkey-Head-Project."
requires-python = ">=3.13,<3.15"
readme = "README.md"
authors = [
  { name = "Dylan L. R. Pollock" },
]
license = { text = "GPL-3.0-only" }
keywords = [
  "hueyos",
  "huey",
  "monkey-head-project",
  "robotics",
  "agent",
  "ai",
  "offline-first",
  "embodied-ai",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: POSIX :: Linux",
]

# Keep the on-robot footprint small; full stack is available via extras.
dependencies = [
  "aiofiles==25.1.0",
  "aiohttp==3.14.0",
  "aiosqlite==0.22.1",
  "anyio==4.13.0",
  "attrs==26.1.0",
  "certifi==2026.4.22",
  "cryptography==48.0.0",
  "evdev==1.9.3; sys_platform == 'linux'",
  "fastapi==0.136.1",
  "orjson==3.11.9",
  "packaging==26.2",
  "psutil==7.2.2",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "PyYAML==6.0.3",
  "python-multipart==0.0.27",
  "requests==2.33.1",
  "sse-starlette==3.4.2",
  "starlette==1.3.1",
  "typing-extensions==4.15.0",
  "uvicorn[standard]==0.46.0; sys_platform != 'emscripten'",
]

[project.urls]
Homepage = "https://www.dlrp.ca"
Repository = "https://github.com/DylanLRPollock/Monkey-Head-Project"
Issues = "https://github.com/DylanLRPollock/Monkey-Head-Project/issues"

