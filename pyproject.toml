[project]
name = "hueyos"
version = "0.2.0"
description = "HueyOS: on-robot runtime for the Monkey Head Project (Huey)."
requires-python = ">=3.13,<3.15"
readme = "README.md"
authors = [
  { name = "Dylan L. R. Pollock" },
]
license = { text = "GPL-3.0-only" }
keywords = [
  "hueyos",
  "huey",
  "monkey-head-project",
  "robotics",
  "agent",
  "ai",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://dlrp.ca"
Repository = "https://github.com/DylanLRPollock/Monkey-Head-Project"
Issues = "https://github.com/DylanLRPollock/Monkey-Head-Project/issues"

# Keep the on-robot footprint small; full stack available via extras
dependencies = [
  "aiofiles==25.1.0",
  "aiohttp==3.13.3",
  "aiosqlite==0.22.1",
  "anyio==4.12.0",
  "attrs==25.4.0",
  "certifi==2026.1.4",
  "cryptography==46.0.5",
  "evdev==1.9.2; sys_platform == 'linux'",
  "fastapi==0.129.0",
  "orjson==3.11.7",
  "packaging==26.0",
  "psutil==7.2.2",
  "pydantic==2.12.5",
  "pydantic-settings==2.12.0",
  "PyYAML==6.0.3",
  "python-multipart==0.0.22",
  "requests==2.32.5",
  "sse-starlette==3.2.0",
  "starlette==0.52.1",
  "typing-extensions==4.15.0",
  "uvicorn[standard]==0.40.0; sys_platform != 'emscripten'",
]

[project.optional-dependencies]
