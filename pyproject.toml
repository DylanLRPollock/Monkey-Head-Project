[project.scripts]
huey = "huey.cli:main"
# HueyOS API console entrypoint.
huey-api = "huey.api:main"
huey-command-center = "huey.apps.command_center.cli:main"

[build-system]
requires = [
  "setuptools>=82.0.1",
  "wheel>=0.46.3",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
target-version = ["py313"]
line-length = 88
# Black treats multiline excludes as verbose regexes; keep the flag explicit.
extend-exclude = '''(?x)
^/src/huey/
(
  connectors/pyhuey
  | memory/PY
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip_glob = [
  "src/huey/connectors/pyhuey/**",
  "src/huey/memory/PY/**",
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [
  "src/huey/connectors/pyhuey",
  "src/huey/memory/PY",
]

[tool.ruff.lint]
ignore = ["E402"]

[tool.flake8]
extend-ignore = [
  "E402",
  "E501",
]
max-line-length = 88
exclude = [
  "archives",
  "src/huey/connectors/pyhuey",
  "src\\huey\\connectors\\pyhuey",
  "src/huey/memory/PY",
  "src\\huey\\memory\\PY",
]
