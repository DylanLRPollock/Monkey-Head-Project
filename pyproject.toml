data = [
  "chroma-hnswlib==0.7.6",
  "chromadb==1.3.5",
  "elastic-transport==9.2.0",
  "elasticsearch==9.2.0",
  "pinecone==8.0.0",
  "pinecone-client==6.0.0",
  "pinecone-plugin-assistant==3.0.1",
  "pinecone-plugin-interface==0.0.7",
]

cloud = [
  "azure-core==1.36.0",
  "azure-identity==1.25.1",
  "boto3==1.42.6",
  "botocore==1.42.6",
  "s3transfer==0.16.0",
]

dev = [
  "black==25.12.0",
  "chromedriver-autoinstaller==0.6.4",
  "click==8.3.1",
  "coloredlogs==15.0.1",
  "debugpy==1.8.17",
  "docker==7.1.0",
  "flake8==7.3.0",
  "httpx==0.28.1",
  "isort==7.0.0",
  "pre-commit==4.5.0",
  "pytest==8.3.4",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
  "ruff==0.14.8",
]

[project.scripts]
huey = "huey.cli:main"
huey-api = "huey.api:main"

[build-system]
requires = [
  "setuptools>=68",
  "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.isort]
profile = "black"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = ["E402"]

[tool.flake8]
extend-ignore = [
  "E402",
  "E501",
]
