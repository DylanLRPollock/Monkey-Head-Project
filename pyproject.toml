  "pygpt-net>=0.3.0",
  "torch==2.5.1; python_version >= '3.12' and python_version < '3.13' and sys_platform != 'win32'",
  "torchaudio==2.5.1; python_version >= '3.12' and python_version < '3.13' and sys_platform != 'win32'",
  "torchvision==0.20.1; python_version >= '3.12' and python_version < '3.13' and sys_platform != 'win32'",
  "sortedcontainers==2.4.0",
  "standard-aifc==3.13.0; python_version >= '3.13' and python_version < '3.15'",
  "traitlets==5.14.3",
  "transformers==4.57.3",
