[project]
name = "hueyos"
version = "0.2.0"
description = "HueyOS: on-robot runtime for the Monkey Head Project (Huey)."
requires-python = ">=3.11,<3.15"
readme = "README.md"
authors = [
  { name = "Dylan L. R. Pollock" },
]
license = { text = "GPL-3.0-only" }
keywords = [
  "hueyos",
  "huey",
  "monkey-head-project",
  "robotics",
  "agent",
  "ai",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://dlrp.ca"
Repository = "https://github.com/DylanLRPollock/Monkey-Head-Project"
Issues = "https://github.com/DylanLRPollock/Monkey-Head-Project/issues"

# Keep the on-robot footprint small; full stack available via extras
dependencies = [
  "aiohttp==3.12.13",
  "aiosqlite==0.21.0",
  "anyio==4.9.0",
  "attrs==25.3.0",
  "certifi==2025.6.15",
  "cryptography==45.0.4",
  "evdev==1.9.2; sys_platform == 'linux'",
  "fastapi==0.115.13",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "sse-starlette==3.0.2",
  "starlette==0.46.2",
  "uvicorn[standard]==0.34.3",
]

[project.optional-dependencies]
ml = [
  "accelerate==1.12.0",
  "aiohappyeyeballs==2.6.1",
  "aiosignal==1.4.0",
  "anthropic[bedrock,vertex]==0.75.0",
  "audioop-lts==0.2.2; python_version >= '3.13' and python_version < '3.15'",
  "pillow==12.0.0",
  "google-ai-generativelanguage==0.9.0",
  "google-genai==1.54.0",
  "google-generativeai==0.8.5",
  "llama-cloud==0.1.45",
  "llama-cloud-services==0.6.88",
  "llama-index==0.14.10",
  "llama-index-core==0.14.10",
  "llama-index-embeddings-azure-openai==0.4.1",
  "llama-index-embeddings-gemini==0.4.1",
  "llama-index-embeddings-huggingface-api==0.4.1",
  "llama-index-embeddings-mistralai==0.4.1",
  "llama-index-embeddings-ollama==0.8.4",
  "llama-index-indices-managed-llama-cloud==0.9.4",
  "llama-index-instrumentation==0.4.2",
  "llama-index-llms-anthropic==0.10.3",
  "llama-index-llms-azure-openai==0.4.2",
  "llama-index-llms-deepseek==0.2.2",
  "llama-index-llms-gemini==0.6.1",
  "llama-index-llms-google-genai==0.8.0",
  "llama-index-llms-huggingface-api==0.6.1",
  "llama-index-llms-mistralai==0.9.0",
  "llama-index-llms-ollama==0.9.0",
  "llama-index-llms-openai==0.6.10",
  "llama-index-llms-openai-like==0.5.3",
  "llama-index-llms-perplexity==0.4.2",
  "llama-index-multi-modal-llms-openai==0.6.2",
  "llama-index-program-openai==0.3.2",
  "llama-index-question-gen-openai==0.3.1",
  "llama-index-readers-chatgpt-plugin==0.4.1",
  "llama-index-readers-database==0.5.1",
  "llama-index-readers-file==0.5.5",
  "llama-index-readers-github==0.9.0",
  "llama-index-readers-google==0.7.2",
  "llama-index-readers-llama-parse==0.5.1",
  "llama-index-readers-microsoft-onedrive==0.4.1",
