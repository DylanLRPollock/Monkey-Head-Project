[project]
name = "hueyos"
version = "0.2.0"
description = "HueyOS: on-robot runtime for the Monkey Head Project (Huey)."
requires-python = ">=3.11,<3.15"
readme = "README.md"
authors = [{ name = "Dylan L. R. Pollock" }]
license = { text = "GPL-3.0-only" }

# Keep the on-robot footprint small; full stack available via extras
dependencies = [
  "aiohttp==3.13.2",
  "aiosqlite==0.21.0",
  "anyio==4.11.0",
  "attrs==25.4.0",
  "certifi==2025.10.5",
  "cryptography==45.0.4",
  "evdev==1.9.2; sys_platform == 'linux'",
  "fastapi==0.121.1",
  "pydantic==2.12.4",
  "pydantic-core==2.41.5",
  "pydantic-settings==2.12.0",
  "sse-starlette==3.0.3",
  "starlette==0.50.0",
  "uvicorn[standard]==0.38.0",
]

[project.optional-dependencies]
ml = [
  "aiohappyeyeballs==2.6.1",
  "aiosignal==1.4.0",
  "anthropic[bedrock,vertex]==0.72.1",
  "audioop-lts==0.2.2; python_version >= '3.13' and python_version < '3.15'",
  "google-ai-generativelanguage==0.9.0",
  "google-genai==1.49.0",
  "google-generativeai==0.8.5",
  "llama-cloud-services==0.6.79",
  "llama-cloud==0.1.44",
  "llama-index==0.14.8",
  "llama-index-core==0.14.8",
  "llama-index-embeddings-azure-openai==0.4.1",
  "llama-index-embeddings-gemini==0.4.1",
  "llama-index-embeddings-huggingface-api==0.4.1",
  "llama-index-embeddings-mistralai==0.4.1",
  "llama-index-embeddings-ollama==0.8.4",
  "llama-index-indices-managed-llama-cloud==0.9.4",
  "llama-index-instrumentation==0.4.2",
  "llama-index-llms-anthropic==0.10.2",
  "llama-index-llms-azure-openai==0.4.2",
  "llama-index-llms-deepseek==0.2.2",
  "llama-index-llms-gemini==0.6.1",
  "llama-index-llms-google-genai==0.7.3",
  "llama-index-llms-huggingface-api==0.6.1",
  "llama-index-llms-mistralai==0.9.0",
  "llama-index-llms-ollama==0.9.0",
  "llama-index-llms-openai-like==0.5.3",
  "llama-index-llms-openai==0.6.8",
  "llama-index-llms-perplexity==0.4.2",
  "llama-index-multi-modal-llms-openai==0.6.2",
  "llama-index-program-openai==0.3.2",
  "llama-index-question-gen-openai==0.3.1",
  "llama-index-readers-chatgpt-plugin==0.4.1",
  "llama-index-readers-database==0.5.1",
  "llama-index-readers-file==0.5.4",
  "llama-index-readers-github==0.9.0",
  "llama-index-readers-google==0.7.2",
  "llama-index-readers-llama-parse==0.5.1",
  "llama-index-readers-microsoft-onedrive==0.4.1",
  "llama-index-readers-twitter==0.4.1",
  "llama-index-readers-web==0.5.6",
  "llama-index-utils-huggingface==0.4.1",
  "llama-index-workflows==1.0.1",
  "llama-parse==0.6.79",
  "mistralai==1.9.11",
  "ollama==0.6.0",
  "onnxruntime==1.23.2",
  "openai-agents==0.5.0",
  "openai==2.7.2",
  "sortedcontainers==2.4.0",
  "standard-aifc==3.13.0; python_version >= '3.13' and python_version < '3.15'",
  "traitlets==5.14.3",
  "transformers==4.57.1",
  "pygpt-net>=0.3.0",
]
data = [
  "chroma-hnswlib==0.7.6",
  "chromadb==1.3.4",
  "elastic-transport==8.17.1",
  "elasticsearch==8.18.1",
  "pinecone-client==6.0.0",
  "pinecone-plugin-assistant==1.7.0",
  "pinecone-plugin-interface==0.0.7",
  "pinecone==7.3.0",
]
cloud = [
  "azure-core==1.36.0",
  "azure-identity==1.25.1",
  "boto3==1.40.71",
  "botocore==1.40.71",
  "s3transfer==0.14.0",
]
dev = [
  "black==24.10.0",
  "chromedriver-autoinstaller==0.6.4",
  "docker==7.1.0",
  "coloredlogs==15.0.1",
  "click==8.3.0",
  "debugpy==1.8.17",
  "pytest==8.3.4",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
  "httpx==0.28.1",
  "isort==7.0.0",
  "pre-commit==4.4.0",
  "ruff==0.14.4",
  "flake8==7.3.0",
]

[project.scripts]
huey = "huey.cli:main"
huey-api = "huey.api:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.isort]
profile = "black"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = ["E402"]

[tool.flake8]
extend-ignore = ["E402", "E501"]
