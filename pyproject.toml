[project.scripts]
huey = "huey.cli:main"
# Kept aligned to the current runtime contract pending the source-level entrypoint fix.
huey-api = "huey.api:main"

[build-system]
requires = [
  "setuptools>=82.0.1",
  "wheel>=0.46.3",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
target-version = ["py313"]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
ignore = ["E402"]

[tool.flake8]
extend-ignore = [
  "E402",
  "E501",
]
max-line-length = 88
