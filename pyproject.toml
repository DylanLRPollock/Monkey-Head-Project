[project]
name = "hueyos"
version = "0.2.0"
description = "HueyOS: on-robot runtime for the Monkey Head Project (Huey)."
requires-python = ">=3.12,<3.14"
readme = "README.md"
authors = [{ name = "Dylan L. R. Pollock" }]
license = { text = "GPL-3.0-only" }

# Keep the on-robot footprint small; full stack available via extras
dependencies = [
  "aiohttp==3.12.13",
  "aiosqlite==0.21.0",
  "anyio==4.9.0",
  "attrs==25.3.0",
  "certifi==2025.6.15",
  "cryptography==45.0.4",
  "evdev==1.9.2; sys_platform == 'linux'",
  "fastapi==0.115.13",
  "pydantic==2.11.7",
  "pydantic-core==2.33.2",
  "pydantic-settings==2.10.1",
  "sse-starlette==3.0.2",
  "starlette==0.46.2",
  "uvicorn[standard]==0.34.3",
]

[project.optional-dependencies]
ml = [
  "aiohappyeyeballs==2.6.1",
  "aiosignal==1.3.2",
  "anthropic[bedrock,vertex]==0.54.0",
  "audioop-lts==0.2.1; python_version == '3.13'",
  "google-ai-generativelanguage==0.6.15",
  "google-genai==1.23.0",
  "google-generativeai==0.8.5",
  "llama-cloud-services==0.6.34",
  "llama-cloud==0.1.26",
  "llama-index==0.12.44",
  "llama-index-core==0.12.44",
  "llama-index-embeddings-azure-openai==0.3.8",
  "llama-index-embeddings-gemini==0.3.2",
  "llama-index-embeddings-huggingface-api==0.3.1",
  "llama-index-embeddings-mistralai==0.3.0",
  "llama-index-embeddings-ollama==0.5.0",
  "llama-index-indices-managed-llama-cloud==0.7.7",
  "llama-index-instrumentation==0.2.0",
  "llama-index-llms-anthropic==0.6.12",
  "llama-index-llms-azure-openai==0.3.4",
  "llama-index-llms-deepseek==0.1.2",
  "llama-index-llms-gemini==0.5.0",
  "llama-index-llms-google-genai==0.2.2",
  "llama-index-llms-huggingface-api==0.3.1",
  "llama-index-llms-mistralai==0.6.1",
  "llama-index-llms-ollama==0.6.2",
  "llama-index-llms-openai-like==0.4.0",
  "llama-index-llms-openai==0.4.7",
  "llama-index-llms-perplexity==0.3.7",
  "llama-index-multi-modal-llms-openai==0.5.1",
  "llama-index-program-openai==0.3.2",
  "llama-index-question-gen-openai==0.3.1",
  "llama-index-readers-chatgpt-plugin==0.3.0",
  "llama-index-readers-database==0.3.0",
  "llama-index-readers-file==0.4.9",
  "llama-index-readers-github==0.5.0",
  "llama-index-readers-google==0.5.0",
  "llama-index-readers-llama-parse==0.4.0",
  "llama-index-readers-microsoft-onedrive==0.3.0",
  "llama-index-readers-twitter==0.3.0",
  "llama-index-readers-web==0.3.9",
  "llama-index-utils-huggingface==0.3.0",
  "llama-index-workflows==1.0.1",
  "llama-parse==0.6.34",
  "mistralai==1.9.1",
  "ollama==0.5.1",
  "onnxruntime==1.20.1",
  "openai-agents==0.2.3",
  "openai==1.96.1",
  "sortedcontainers==2.4.0",
  "standard-aifc==3.13.0; python_version == '3.13'",
  "traitlets==5.14.3",
  "transformers==4.48.3",
  "pygpt-net>=0.3.0",
