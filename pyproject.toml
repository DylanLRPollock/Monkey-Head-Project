# ---------------------------------------------------------------------------
# Monkey-Head-Project
# Component: HueyOS / Project Metadata & Tooling
# Author: Dylan L.R. Pollock
# Documentation: https://www.dlrp.ca
#
# Philosophy: Breathing new life into old tech.
# ---------------------------------------------------------------------------
#
# This file is the single source of truth for:
#   * Package identity, version, and dependencies (PEP 621 `[project]`).
#   * Build backend selection (`[build-system]`).
#   * Tool configuration for black, isort, ruff, pytest, coverage, mypy,
#     and bandit.
#
# Conventions:
#   * Runtime deps go in `[project].dependencies`. Anything optional goes in
#     an extra. The default install is deliberately small for the on-robot
#     footprint; the ML/data/cloud stacks are opt-in.
#   * Pins are exact (`==`). `constraints.txt` is a mirror for `pip install
#     -c`; `make check-deps-sync` verifies the two agree.
#   * Tool config lives here unless the tool cannot read pyproject.toml.
#     flake8 is the notable exception -- it reads `.flake8`, not
#     `[tool.flake8]`, so a `[tool.flake8]` table here would be inert.
#   * The vendored and legacy trees under `src/huey/connectors/pyhuey` and
#     `src/huey/memory/PY` are excluded from every formatter and linter.
#     If you add a new exclusion, add it to all of them in the same commit.

[project]
name = "hueyos"
version = "0.2.0"
description = "HueyOS: offline-first embodied AI / OS for Huey and the Monkey-Head-Project."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
  { name = "Dylan L. R. Pollock" },
]
# PEP 639: SPDX expression + explicit license file. Replaces the deprecated
# `license = { text = "..." }` table and the matching trove classifier.
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = [
  "hueyos",
  "huey",
  "monkey-head-project",
  "robotics",
  "agent",
  "ai",
  "offline-first",
  "embodied-ai",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Operating System",
  "Operating System :: POSIX :: Linux",
]

# Keep the on-robot footprint small; full stack is available via extras.
dependencies = [
  "aiofiles==25.1.0",
  "aiohttp==3.14.3",
  "aiosqlite==0.22.1",
  "anyio==4.15.1",
  "attrs==26.1.0",
  "certifi==2026.7.22",
  "cryptography==50.0.1",
  "evdev==2.0.0; sys_platform == 'linux'",
  "fastapi==0.141.1",
  "orjson==3.12.0",
  "packaging==26.3",
  "psutil==7.2.2",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "PyYAML==6.0.3",
  "python-multipart==0.0.32",
  "requests==2.34.2",
  "sse-starlette==3.4.11",
  "starlette==1.6.0",
  "typing-extensions==4.16.0",
  "uvicorn[standard]==0.53.0; sys_platform != 'emscripten'",
]

[project.urls]
Homepage = "https://www.dlrp.ca"
Repository = "https://github.com/DylanLRPollock/Monkey-Head-Project"
Issues = "https://github.com/DylanLRPollock/Monkey-Head-Project/issues"

