  "elastic-transport==9.2.1",
  "elasticsearch==9.3.0",
  "faiss-cpu==1.13.2; sys_platform != 'win32'",
  "pandas==3.0.1",
  "pinecone==8.1.0",
  "pinecone-client==6.0.0",
  "pinecone-plugin-assistant==3.0.2",
  "pinecone-plugin-interface==0.0.7",
  "qdrant-client==1.17.0",
  "weaviate-client==4.20.1",
]

# --- Cloud SDKs ---
cloud = [
  "azure-core==1.38.2",
  "azure-identity==1.25.2",
  "boto3==1.42.57",
  "botocore==1.42.57",
  "google-cloud-aiplatform==1.139.0",
  "google-cloud-storage==3.9.0",
  "s3transfer==0.16.0",
]

# --- Dev toolchain ---
dev = [
  "bandit==1.9.4",
  "black==26.1.0",
  "chromedriver-autoinstaller==0.6.4",
  "click==8.3.1",
  "coloredlogs==15.0.1",
  "debugpy==1.8.20",
  "docker==7.1.0",
  "flake8==7.3.0",
  "flake8-bugbear==25.11.29",
  "httpx==0.28.1",
  "ipython==9.10.0",
  "isort==7.0.0",
  "mypy==1.19.1",
  "pip-tools==7.5.3",
  "pre-commit==4.5.1",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
  "rich==14.3.3",
  "ruff==0.15.4",
  "types-PyYAML==6.0.12.20250915",
  "types-requests==2.32.4.20260107",
  "uv==0.10.6",
]

# --- Audio IO ---
audio = [
  "pydub==0.25.1",
  "sounddevice==0.5.5",
  "soundfile==0.13.1",
]

[project.scripts]
huey = "huey.cli:main"
huey-api = "huey.api:main"

[build-system]
requires = [
  "setuptools>=82.0.0",
  "wheel>=0.46.3",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.isort]
profile = "black"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
ignore = ["E402"]

[tool.flake8]
extend-ignore = [
  "E402",
  "E501",
]