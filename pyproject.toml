# ---------------------------------------------------------------------------
# Console entry points
# ---------------------------------------------------------------------------

[project.scripts]
huey = "huey.cli:main"
huey-api = "huey.api:main"
huey-command-center = "huey.apps.command_center.cli:main"

# ---------------------------------------------------------------------------
# Build backend
# ---------------------------------------------------------------------------

[build-system]
requires = [
  "setuptools>=82.0.1",
  "wheel>=0.46.3",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
# Vendored / legacy trees are intentionally not installed as importable
# packages; they exist on disk for source inspection only.
exclude = [
  "tests*",
  "huey.connectors.pyhuey*",
  "huey.memory.PY*",
]

[tool.setuptools.package-data]
# Ship the PEP 561 marker and any bundled config schemas alongside the code.
huey = [
  "py.typed",
  "**/*.json",
  "**/*.yaml",
  "**/*.yml",
  "**/*.toml",
  "**/*.sql",
]

# ---------------------------------------------------------------------------
# Formatting
# ---------------------------------------------------------------------------

[tool.black]
target-version = ["py313"]
line-length = 88
# Black matches paths relative to the repo root, without a leading slash.
# The previous `^/src/...` pattern was anchored to a slash that never
# appears in Black's path strings, so it matched nothing.
extend-exclude = '''
(?x)^(
    src/huey/connectors/pyhuey/
  | src/huey/memory/PY/
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip_glob = [
  "src/huey/connectors/pyhuey/**",
  "src/huey/memory/PY/**",
]

# ---------------------------------------------------------------------------
# Linting (ruff)
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [
  "src/huey/connectors/pyhuey",
  "src/huey/memory/PY",
]

[tool.ruff.lint]
# Rule families selected for this project. See:
# https://docs.astral.sh/ruff/rules/
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort-compatible import sorting
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade (modernise syntax for py313)
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
]
ignore = [
  "E501", # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files exist to re-export; F401 is the point.
"src/huey/__init__.py" = ["F401"]
# Root shim and CLI entry points manipulate sys.path before importing.
"run.py" = ["E402"]
"src/huey/cli/*.py" = ["E402"]
# Tests are allowed to use asserts, magic numbers, and long lines.
"tests/**" = ["S101", "PLR2004", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

# ---------------------------------------------------------------------------
# Testing (pytest)
# ---------------------------------------------------------------------------
# The `asyncio` marker is registered in `conftest.py` rather than here, so
# the marker stays next to the hook that implements it.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
filterwarnings = [
  "error",
  # Keep these as warnings until the upstream fix lands.
  "default::DeprecationWarning:starlette.*",
  "default::DeprecationWarning:pydantic.*",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["src/huey"]
omit = [
  "src/huey/connectors/pyhuey/*",
  "src/huey/memory/PY/*",
  "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "@(abc\\.)?abstractmethod",
  "@overload",
]

[tool.coverage.xml]
output = "coverage.xml"

# ---------------------------------------------------------------------------
# Type checking (mypy)
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.13"
# Keep the strictness ratchet on. If a module cannot meet these, add it to
# `[[tool.mypy.overrides]]` with an explicit reason rather than weakening
# the global config.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true
exclude = [
  "src/huey/connectors/pyhuey",
  "src/huey/memory/PY",
]

[[tool.mypy.overrides]]
# Vendored tree; typing it is not worth the churn.
module = ["huey.connectors.pyhuey.*"]
ignore_errors = true

# ---------------------------------------------------------------------------
# Security (bandit)
# ---------------------------------------------------------------------------
# The pre-commit hook runs `bandit -c pyproject.toml`, so this table is what
# actually drives the scan. Keep `exclude_dirs` in sync with the other tools.

[tool.bandit]
exclude_dirs = [
  "tests",
  "src/huey/connectors/pyhuey",
  "src/huey/memory/PY",
]
skips = [
  "B101", # assert_used: pytest relies on assert
]