# grub.cfg for MHP Monkey‑Head Live USB
set default=0
set timeout=5

# locate the ISO on removable media by its filesystem UUID
# replace <YOUR-ISO-UUID> with the actual UUID of the FAT32 partition
search --no-floppy --fs-uuid --set=root <YOUR-ISO-UUID>

#==============================================================================
# 1) Live Session (RAM‑resident + Persistence)
#==============================================================================
menuentry "MHP Live Desktop (toram + persistence)" --hotkey=l {
    echo   "Loading Linux kernel into RAM with persistence..."
    linux  /live/vmlinuz   \
           boot=live \
           persistence \
           toram \
           verbose \
           nosplash \
           quiet \
           findiso=${root}
    initrd /live/initrd.img
}

#==============================================================================
# 2) Live Session Fail‑Safe (no persistence, safe mode)
#==============================================================================
menuentry "MHP Live Desktop (fail-safe mode)" --hotkey=f {
    echo   "Loading Linux kernel (fail-safe)..."
    linux  /live/vmlinuz \
           boot=live \
           components \
           memtest \
           noapic \
           noapm \
           nodma \
           nomce \
           nosmp \
           nosplash \
           vga=788 \
           findiso=${root}
    initrd /live/initrd.img
}

#==============================================================================
# 3) Graphical Installer Entry
#==============================================================================
menuentry "Install Debian (Graphical)" --hotkey=i {
    echo   "Loading Debian graphical installer..."
    linux  /install/gtk/vmlinuz \
           boot=install \
           findiso=${root} \
           persistence \
           nosplash \
           quiet
    initrd /install/gtk/initrd.gz
}

#==============================================================================
# 4) Utilities & Maintenance Submenu
#==============================================================================
submenu "Utilities & Testing ..." --hotkey=u {
    # Integrity check
    menuentry "Verify medium checksums" --hotkey=v {
        echo   "Verifying ISO integrity..."
        linux  /live/vmlinuz \
               boot=live \
               components \
               findiso=${root} \
               verify-checksums \
               quiet
        initrd /live/initrd.img
    }

    # UEFI Firmware Setup
    if [ "${grub_platform}" = "efi" ]; then
        menuentry "UEFI Firmware Settings" --hotkey=s {
            fwsetup
        }
    fi

    # Memory test (if memtest included)
    if [ -e /boot/memtest86+ ]; then
        menuentry "Memtest86+" --hotkey=m {
            linux16 /boot/memtest86+.bin
        }
    fi
}

#==============================================================================
# 5) Advanced Options Submenu (e.g., older kernels if you add them)
#==============================================================================
submenu "Advanced options ..." --hotkey>a {
    # Placeholder for additional kernels or rescue entries
    # You can duplicate the above entries here with different kernel versions
}

# End of grub.cfg
