# =============================================================================
# HueyOS modprobe policy: v100-workstation
# =============================================================================
#
# Installation status
# -------------------
# This file is NOT installed by any build or CI step. It is staged under
# build/huey-kernel/ for operator review and installed into
# /etc/modprobe.d/huey-v100.conf only by
# docs/runbooks/huey-kernel-upgrade.md (Step 29), after explicit approval.
#
# Scope
# -----
# This file exists to make three binding decisions explicit for the
# v100-workstation profile:
#
#   1. Nouveau must never claim the Tesla V100.
#   2. AMDGPU must remain loadable (RX 570 display path).
#   3. The proprietary NVIDIA 580.196.07 modules must remain loadable
#      (V100 compute path; the open modules are not Volta-compatible).
#
# The custom kernel already disables CONFIG_DRM_NOUVEAU entirely for this
# profile (kernel/huey-linux/profiles/v100-workstation.config, Step 10), so
# Nouveau should not exist as a module on the target kernel. The Nouveau
# rules below are defense in depth: they protect against a stale initramfs,
# a future config drift, or an operator accidentally loading Nouveau.
# =============================================================================

# --- Nouveau exclusion (defense in depth) -----------------------------------
#
# `blacklist nouveau` suppresses automatic loading via internal aliases and
# udev, but by itself does NOT prevent an explicit `modprobe nouveau`
# (modprobe.d(5)). Combine it with `install nouveau /bin/false` so that any
# load attempt—automatic or explicit—fails closed. `options nouveau
# modeset=0` is the NVIDIA-documented fallback; it stops Nouveau from
# driving modesetting even if the module were somehow present.
#
# This pattern matches Debian's nvidia-driver packaging, which ships
# nvidia-blacklists-nouveau.conf and includes it in the initramfs via
# dracut's install_items (Debian wiki NvidiaGraphicsDrivers, V100 family
# section). The difference here is that we stage the rules under the
# HueyOS profile and install them only through the runbook, so the build
# itself cannot alter the running host's modprobe state.
blacklist nouveau
install nouveau /bin/false
options nouveau modeset=0

# --- AMDGPU must remain loadable --------------------------------------------
#
# The AMD RX 570 is the display GPU. Its driver is amdgpu, built as a module
# by the profile fragment. Do NOT add `blacklist amdgpu` or
# `install amdgpu /bin/false` here: doing so would break display bring-up
# and leave the workstation without a graphical console.

# --- Proprietary NVIDIA compute path ----------------------------------------
#
# The Tesla V100 uses the proprietary 580.196.07 modules staged in Step 14.
# Do NOT blacklist any of:
#   nvidia
#   nvidia-uvm
#   nvidia-modeset   (optional; not required for the V100, but must remain
#                     loadable if a future profile enables display on an
#                     NVIDIA GPU)
#   nvidia-drm       (optional; same rationale)
#
# No `options nvidia ...` line is set in this file. Any NVreg_* option must
# be documented by the 580.196.07 branch for this exact workload and added
# in a separate reviewed change with provenance. Inventing options here
# could silently disable features the V100 needs, or fail the module load.
