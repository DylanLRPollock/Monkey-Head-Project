---
minimum_pre_commit_version: "3.7.0"

# Use the same Python baseline everywhere unless explicitly overridden.
default_language_version:
  python: python3.11

# Avoid running hooks on generated / tool-managed directories.
exclude: |
  (?x)^(
    \.git/
    | \.venv/
    | venv/
    | build/
    | dist/
    | \.mypy_cache/
    | \.pytest_cache/
    | \.idea/
    | \.vscode/
    | node_modules/
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Whitespace and line endings
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending

      # Basic safety checks
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key

      # Config / data file validation
      - id: check-yaml
      - id: check-json
      - id: check-toml

      # Keep very large blobs out of the repo (500 KiB per file)
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.11

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        language_version: python3.11

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        language_version: python3.11
        additional_dependencies:
          - flake8-bugbear==24.8.19

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        language_version: python3.11
        args: ["-ll"]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
      - id: markdownlint