# SubOS Kubernetes manifest
apiVersion: v1
kind: Namespace
metadata:
  name: subos

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subos-deployment
  namespace: subos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: subos
  template:
    metadata:
      labels:
        app: subos
    spec:
      containers:
        - name: subos
          image: subos:local
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh","-lc"]
          args: ["sleep infinity"]
          volumeMounts:
            - name: workspace
              mountPath: /home/subos/SubOS
      volumes:
        - name: workspace
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: subos-service
  namespace: subos
spec:
  selector:
    app: subos
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
