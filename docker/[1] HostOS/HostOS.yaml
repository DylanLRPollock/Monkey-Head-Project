# HostOS Kubernetes manifest
# Apply with: kubectl apply -f HostOS.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: hostos

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hostos-config
  namespace: hostos
data:
  HOSTOS_GREETING: "Welcome to Huey HostOS"
  HOSTOS_PATH: "/home/hostos/HostOS"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostos-toolbox
  namespace: hostos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hostos-toolbox
  template:
    metadata:
      labels:
        app: hostos-toolbox
    spec:
      containers:
        - name: hostos
          # Replace this with your built image, e.g. ghcr.io/dylanlrpollock/hostos:latest
          image: hostos:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: hostos-config
          command: ["python"]
          args:
            - "-m"
            - "monkey_head.services.hostos_runtime"
            - "--vnc-port"
            - "5901"
            - "--dashboard-port"
            - "8000"
          ports:
            - containerPort: 5901
              name: vnc
            - containerPort: 8000
              name: dashboard
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: dashboard
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: dashboard
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: workspace
              mountPath: /home/hostos/HostOS
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: hostos-workspace

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hostos-workspace
  namespace: hostos
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

---
apiVersion: v1
kind: Service
metadata:
  name: hostos-vnc
  namespace: hostos
spec:
  selector:
    app: hostos-toolbox
  ports:
    - name: vnc
      port: 5901
      targetPort: 5901
    - name: dashboard
      port: 8000
      targetPort: 8000
  type: ClusterIP
