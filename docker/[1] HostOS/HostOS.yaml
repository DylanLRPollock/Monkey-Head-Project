# HostOS Kubernetes manifest
# Apply with: kubectl apply -f HostOS.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: hostos

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hostos-config
  namespace: hostos
  labels: { app: hostos }
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hostos-memory
  namespace: hostos
  labels: { app: hostos }
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hostos-config
  namespace: hostos
data:
  HOSTOS_GREETING: "Welcome to Huey HostOS"
  HOSTOS_PATH: "/workspace"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostos-toolbox
  namespace: hostos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hostos-toolbox
  template:
    metadata:
      labels:
        app: hostos-toolbox
    spec:
      containers:
        - name: hostos
          image: ghcr.io/dylanlrpollock/hueyos:hostos
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: hostos-config
          ports:
            - containerPort: 1995
              name: http1995
          volumeMounts:
            - name: config
              mountPath: /workspace/config
            - name: memory
              mountPath: /workspace/memory
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: hostos-config
        - name: memory
          persistentVolumeClaim:
            claimName: hostos-memory

---
apiVersion: v1
kind: Service
metadata:
  name: hostos-api
  namespace: hostos
spec:
  selector:
    app: hostos-toolbox
  ports:
    - name: http1995
      port: 1995
      targetPort: 1995
  type: ClusterIP
