# HostOS Kubernetes manifest
# Apply with: kubectl apply -f HostOS.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: hostos

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hostos-config
  namespace: hostos
data:
  HOSTOS_GREETING: "Welcome to Huey HostOS"
  HOSTOS_PATH: "/home/hostos/HostOS"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostos-toolbox
  namespace: hostos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hostos-toolbox
  template:
    metadata:
      labels:
        app: hostos-toolbox
    spec:
      containers:
        - name: hostos
          # Replace this with your built image, e.g. ghcr.io/dylanlrpollock/hostos:latest
          image: hostos:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: hostos-config
          command: ["/bin/sh","-lc"]
          args: ["sleep infinity"]
          ports:
            - containerPort: 5901
              name: vnc
          volumeMounts:
            - name: workspace
              mountPath: /home/hostos/HostOS
      volumes:
        - name: workspace
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: hostos-vnc
  namespace: hostos
spec:
  selector:
    app: hostos-toolbox
  ports:
    - name: vnc
      port: 5901
      targetPort: 5901
  type: ClusterIP
