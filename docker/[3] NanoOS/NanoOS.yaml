# NanoOS Kubernetes manifest (Deployment pattern)
apiVersion: v1
kind: Namespace
metadata:
  name: nanoos

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nanoos-config
  namespace: nanoos
  labels: { app: nanoos }
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nanoos-memory
  namespace: nanoos
  labels: { app: nanoos }
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanoos-deployment
  namespace: nanoos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nanoos
  template:
    metadata:
      labels:
        app: nanoos
    spec:
      containers:
        - name: nanoos
          image: ghcr.io/dylanlrpollock/hueyos:nanoos
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1995
              name: http1995
          volumeMounts:
            - name: config
              mountPath: /workspace/config
            - name: memory
              mountPath: /workspace/memory
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: nanoos-config
        - name: memory
          persistentVolumeClaim:
            claimName: nanoos-memory

---
apiVersion: v1
kind: Service
metadata:
  name: nanoos-service
  namespace: nanoos
spec:
  selector:
    app: nanoos
  ports:
    - name: http1995
      port: 1995
      targetPort: 1995
  type: ClusterIP
