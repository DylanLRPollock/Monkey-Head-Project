# NanoOS Kubernetes manifest (Deployment pattern)
apiVersion: v1
kind: Namespace
metadata:
  name: nanoos

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanoos-deployment
  namespace: nanoos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nanoos
  template:
    metadata:
      labels:
        app: nanoos
    spec:
      containers:
        - name: nanoos
          image: nanoos:local
          imagePullPolicy: IfNotPresent
          command: ["python"]
          args:
            - "-m"
            - "monkey_head.services.nano_runtime"
            - "--port"
            - "8081"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "750m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 8
            periodSeconds: 10
          volumeMounts:
            - name: workspace
              mountPath: /home/nanoos/NanoOS
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: nanoos-workspace

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nanoos-workspace
  namespace: nanoos
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: nanoos-service
  namespace: nanoos
spec:
  selector:
    app: nanoos
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
