# NanoOS Kubernetes manifest (Deployment pattern)
apiVersion: v1
kind: Namespace
metadata:
  name: nanoos

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanoos-deployment
  namespace: nanoos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nanoos
  template:
    metadata:
      labels:
        app: nanoos
    spec:
      containers:
        - name: nanoos
          image: nanoos:local
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh","-lc"]
          args: ["sleep infinity"]
          volumeMounts:
            - name: workspace
              mountPath: /home/nanoos/NanoOS
      volumes:
        - name: workspace
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: nanoos-service
  namespace: nanoos
spec:
  selector:
    app: nanoos
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
