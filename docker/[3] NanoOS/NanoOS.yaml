# NanoOS Kubernetes manifest (Deployment pattern)
apiVersion: v1
kind: Namespace
metadata:
  name: nanoos

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nanoos-config
  namespace: nanoos
  labels: { app: nanoos }
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nanoos-memory
  namespace: nanoos
  labels: { app: nanoos }
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nanoos-workload
  namespace: nanoos
data:
  start-nanoos.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    export NANOOS_CONTROL_PORT="${NANOOS_CONTROL_PORT:-8081}"

    python3 - <<'PY'
    import http.server
    import os
    import socketserver
    import threading
    import time

    PORT = int(os.environ.get("NANOOS_CONTROL_PORT", "8081"))


    class ControlHandler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path in {"/healthz", "/readyz"}:
                self.send_response(200)
                self.send_header("Content-Type", "text/plain")
                self.end_headers()
                self.wfile.write(b"ok")
                return

            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(b'{"nanoos":"real-time loops active"}')

        def log_message(self, *_args, **_kwargs):  # pragma: no cover
            return


    class ThreadingHTTPServer(socketserver.ThreadingMixIn, http.server.HTTPServer):
        daemon_threads = True


    def loop(name: str, interval: float) -> None:
        while True:
            print(f"[NanoOS] {name} cycle", flush=True)
            time.sleep(interval)


    def serve_http() -> None:
        with ThreadingHTTPServer(("", PORT), ControlHandler) as httpd:
            print(f"[NanoOS] Control interface on port {PORT}", flush=True)
            httpd.serve_forever()


    threading.Thread(target=serve_http, daemon=True).start()
    threading.Thread(target=loop, args=("Motor control", 2.0), daemon=True).start()
    threading.Thread(target=loop, args=("Telemetry uplink", 3.0), daemon=True).start()
    loop("Safety watchdog", 1.0)
    PY

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanoos-deployment
  namespace: nanoos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nanoos
  template:
    metadata:
      labels:
        app: nanoos
    spec:
      containers:
        - name: nanoos
          image: ghcr.io/dylanlrpollock/hueyos:nanoos
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/opt/hueyos/start-nanoos.sh"]
          env:
            - name: NANOOS_CONTROL_PORT
              value: "8081"
          ports:
            - containerPort: 8081
              name: control
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: control
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: control
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /workspace/config
            - name: memory
              mountPath: /workspace/memory
            - name: nanoos-workload
              mountPath: /opt/hueyos/start-nanoos.sh
              subPath: start-nanoos.sh
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: nanoos-config
        - name: memory
          persistentVolumeClaim:
            claimName: nanoos-memory
        - name: nanoos-workload
          configMap:
            name: nanoos-workload
            defaultMode: 0755

---
apiVersion: v1
kind: Service
metadata:
  name: nanoos-service
  namespace: nanoos
spec:
  selector:
    app: nanoos
  ports:
    - name: control
      port: 8081
      targetPort: control
  type: ClusterIP
