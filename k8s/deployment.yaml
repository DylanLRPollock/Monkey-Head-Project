# Kubernetes deployment for Monkey Head Application
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monkey-head
spec:
  replicas: 2
  selector:
    matchLabels:
      app: monkey-head
  template:
    metadata:
      labels:
        app: monkey-head
    spec:
      containers:
      - name: monkey-head
        image: monkey-head-project:latest
        env:
        - name: APP_ENV
          value: "production"
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: monkey-head
spec:
  selector:
    app: monkey-head
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP

