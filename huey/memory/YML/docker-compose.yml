name: monkey-head-project

x-service-defaults: &service_defaults
  init: true
  tty: true
  stdin_open: true
  restart: unless-stopped
  stop_grace_period: 15s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

networks:
  front: {}
  back: {}

volumes:
  # Windows L:\ bound into containers via Docker Desktop WSL path
  shared_l:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /run/desktop/mnt/host/l

services:
  dev-env:
    <<: *service_defaults
    image: monkey-head-project:latest         # tag produced by build
    container_name: monkey-head-project
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        PYTHON_VERSION: "3.13.5"
        DEBIAN_VERSION: "trixie"
    working_dir: /workspace
    env_file: [.env]
    environment:
      VIRTUAL_ENV: /opt/venv
      PATH: "/opt/venv/bin:$$PATH"
      APP_ENV: ${APP_ENV:-production}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - .:/workspace
      - shared_l:/L
      # tmpfs example for faster I/O (optional):
      # - type: tmpfs
      #   target: /tmp
    ports:
      - "1995:1995"
    expose: ["1995"]
    healthcheck:
      test: ["CMD-SHELL", "sh -lc 'command -v python >/dev/null || command -v python3 >/dev/null'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    shm_size: "1g"
    networks: [back, front]

  debian-tools:
    <<: *service_defaults
    image: debian:trixie
    profiles: ["tools"]
    command: ["sleep","infinity"]
    working_dir: /workspace
    volumes:
      - .:/workspace
      - shared_l:/L
    networks: [back]

  # Optional example dependency (enable with --profile extras)
  redis:
    <<: *service_defaults
    image: redis:7-alpine
    profiles: ["extras"]
    command: ["redis-server","--appendonly","yes"]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [back]
