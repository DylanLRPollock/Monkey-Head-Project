name: hueyos

x-service-defaults: &service_defaults
  restart: unless-stopped
  tty: true
  init: true
  stop_grace_period: 15s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *service_defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${HUEY_PYTHON_VERSION:-3.11-slim}
        HUEY_EXTRAS: ${HUEY_BUILD_EXTRAS:-ml,data,cloud}
    image: ${HUEY_IMAGE:-hueyos:latest}
    container_name: ${HUEY_API_CONTAINER:-hueyos-api}
    env_file:
      - ${HUEY_ENV_FILE:-huey.env.example}
    environment:
      HUEY_API_PORT: ${HUEY_API_PORT:-1995}
      HUEY_CONFIG_DIR: /app/config
      HUEY_MEMORY_DIR: /app/memory
    volumes:
      - ./config:/app/config
      - ./memory:/app/memory
    ports:
      - "${HUEY_API_PORT:-1995}:1995"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1995/healthz', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *service_defaults
    image: ${HUEY_IMAGE:-hueyos:latest}
    container_name: ${HUEY_WORKER_CONTAINER:-hueyos-worker}
    command:
      - huey
      - run
      - --cli
    environment:
      HUEY_CONFIG_DIR: /app/config
      HUEY_MEMORY_DIR: /app/memory
    volumes:
      - ./config:/app/config
      - ./memory:/app/memory
    depends_on:
      api:
        condition: service_healthy
    profiles: ["worker"]

  redis:
    <<: *service_defaults
    image: redis:7-alpine
    container_name: ${HUEY_REDIS_CONTAINER:-hueyos-redis}
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    profiles: ["extras"]

volumes:
  redis-data: {}
