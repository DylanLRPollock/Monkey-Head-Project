name: hueyos
# NOTE: Keep image tag upgrades deliberate and review them in PRs.

x-service-defaults: &service_defaults
  restart: unless-stopped
  tty: true
  init: true
  stop_grace_period: 15s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *service_defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${HUEY_PYTHON_VERSION:-3.13-bookworm}
        HUEY_EXTRAS: ${HUEY_BUILD_EXTRAS:-ml,data,cloud}
    image: ${HUEY_IMAGE:-hueyos:0.1.0}
    container_name: ${HUEY_API_CONTAINER:-hueyos-api}
    command: ["huey-api"]
    env_file:
      - ${HUEY_ENV_FILE:-huey.env.example}
    environment:
      HUEY_HOST: ${HUEY_HOST:-0.0.0.0}
      HUEY_PORT: ${HUEY_PORT:-1995}
      HUEY_CONFIG_DIR: /app/config
      HUEY_MEMORY_DIR: /app/memory
    volumes:
      - ./config:/app/config
      - ./memory:/app/memory
    ports:
      # Dev-safe default: publish to loopback only.
      # Remote access patterns (opt-in): SSH tunnel, authenticated reverse
      # proxy, or TLS + auth before any non-local exposure.
      - "${HUEY_BIND_ADDR:-127.0.0.1}:${HUEY_PORT:-1995}:1995"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1995/healthz', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s


  pyhuey-cockpit:
    <<: *service_defaults
    build:
      context: .
      dockerfile: pyhuey/Dockerfile
    image: ${PYHUEY_IMAGE:-pyhuey-cockpit:0.1.0}
    container_name: ${PYHUEY_CONTAINER:-pyhuey-cockpit}
    command: ["--workdir=/data"]
    volumes:
      - ./pyhuey-data:/data
    profiles: ["cockpit"]

  worker:
    <<: *service_defaults
    image: ${HUEY_IMAGE:-hueyos:0.1.0}
    container_name: ${HUEY_WORKER_CONTAINER:-hueyos-worker}
    command:
      - huey
      - run
      - --cli
    env_file:
      - ${HUEY_ENV_FILE:-huey.env.example}
    environment:
      HUEY_CONFIG_DIR: /app/config
      HUEY_MEMORY_DIR: /app/memory
    volumes:
      - ./config:/app/config
      - ./memory:/app/memory
    depends_on:
      api:
        condition: service_healthy
    profiles: ["worker"]

  redis:
    <<: *service_defaults
    image: redis:7.2-alpine
    container_name: ${HUEY_REDIS_CONTAINER:-hueyos-redis}
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    profiles: ["extras"]

volumes:
  redis-data: {}
