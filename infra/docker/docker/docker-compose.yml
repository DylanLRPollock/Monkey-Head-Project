name: monkey-head-project
# NOTE: Keep image tag upgrades deliberate and review them in PRs.

x-service-defaults: &service_defaults
  init: true
  tty: true
  stdin_open: true
  restart: unless-stopped
  stop_grace_period: 15s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-api-healthcheck: &api_healthcheck
  test:
    - CMD-SHELL
    - curl -fsS http://127.0.0.1:${API_PORT:-1995}/healthz >/dev/null || exit 1
  interval: 30s
  timeout: 5s
  retries: 5
  start_period: 10s

networks:
  front: {}
  back: {}

volumes:
  # Windows L:\ bound into containers via Docker Desktop WSL path
  shared_l:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /run/desktop/mnt/host/l

services:
  dev-env:
    <<: *service_defaults
    image: monkey-head-project:0.1.0-dev         # tag produced by build
    container_name: monkey-head-project
    command:
      - bash
      - -lc
      - >-
          exec python -m uvicorn huey.api:app
          --host 0.0.0.0
          --port ${API_PORT:-1995}
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        PYTHON_VERSION: "3.13.5"
        PYTHON_NEXT_VERSION: "3.14.0"
        DEBIAN_VERSION: "forky"
    working_dir: /workspace
    env_file: [.env]
    environment:
      VIRTUAL_ENV: /opt/venv
      PATH: "/opt/venv/bin:$$PATH"
      APP_ENV: ${APP_ENV:-production}
      TZ: ${TZ:-Etc/UTC}
      API_PORT: ${API_PORT:-1995}
    volumes:
      - .:/workspace
      - ./.env:/workspace/.env:ro
      - ./memory:/workspace/memory
      - shared_l:/L
      - type: bind
        source: ${SHARED_HOST_DIR:-./shared-host}
        target: /workspace/shared-host
        read_only: true
      # tmpfs example for faster I/O (optional):
      # - type: tmpfs
      #   target: /tmp
    ports:
      # Dev-safe default: loopback-only host publish.
      # For remote access, keep this opt-in and use SSH tunneling, or put
      # the service behind an authenticated reverse proxy with TLS.
      - "127.0.0.1:${API_PORT:-1995}:1995"
    expose: ["1995"]
    healthcheck: *api_healthcheck
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    shm_size: "1g"
    networks: [back, front]

  debian-tools:
    <<: *service_defaults
    image: debian:bookworm
    profiles: ["tools"]
    command: ["sleep", "infinity"]
    working_dir: /workspace
    volumes:
      - .:/workspace
      - shared_l:/L
    networks: [back]

  subos:
    <<: *service_defaults
    build:
      context: docker/subos
      dockerfile: Dockerfile
    image: subos:local
    profiles: ["subos"]
    ports:
      # VNC/GUI-adjacent helper service: localhost publish by default.
      # Non-local exposure must be explicitly protected (TLS + auth).
      - "127.0.0.1:8080:8080"
    networks: [back]

  nanoos:
    <<: *service_defaults
    build:
      context: docker/nanoos
      dockerfile: Dockerfile
    image: nanoos:local
    profiles: ["nanoos"]
    ports:
      # VNC/GUI-adjacent helper service: localhost publish by default.
      # Prefer SSH tunnel or authenticated reverse proxy for remote access.
      - "127.0.0.1:8081:8081"
    networks: [back]

  # Optional example dependency (enable with --profile extras)
  redis:
    <<: *service_defaults
    image: redis:7.2-alpine
    profiles: ["extras"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [back]
