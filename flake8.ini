# ---------------------------------------------------------------------------
# Monkey-Head-Project
# Component: HueyOS / Flake8 Configuration
# Author: Dylan L.R. Pollock
# Documentation: https://www.dlrp.ca
#
# Philosophy: Breathing new life into old tech.
# ---------------------------------------------------------------------------
#
# flake8 owns structural linting: undefined names, unused imports, and
# bugbear-style hazards. Formatting is delegated to Black and Ruff, so this
# file deliberately stays small and only tunes what flake8 uniquely does.
#
# Keep `max-line-length` in sync with Black and the `[*]` section of
# .editorconfig. If you change one, change all three.

[flake8]
# --- Line length -----------------------------------------------------------
# Black's target width. E501 is silenced below in favour of B950, which
# allows a small grace band (10%) around this number so Black's wrapping
# decisions never fail the linter.
max-line-length = 88

# --- Ignores ---------------------------------------------------------------
#   E402 -> module-level imports not at top; required in shim modules
#           (run.py, CLI entry points) that mutate sys.path first.
#   E501 -> line length; delegated to B950 below and to Black.
#   W503 -> line break before binary operator (legacy pycodestyle).
#   W504 -> line break after binary operator (Black's preferred wrapping).
# pycodestyle 2.5+ disables W503 and W504 by default, but listing both
# documents the intent if anyone is pinned to an older version.
extend-ignore =
    E402,
    E501,
    W503,
    W504

# --- Selection -------------------------------------------------------------
# Explicit plugin contract. Using `select` (not `extend-select`) means a
# newly installed plugin will not silently start failing CI -- it has to
# be added here first. That is deliberate for a repo that wants a stable
# lint contract.
#
#   C4   -> flake8-comprehensions
#   C90  -> mccabe cyclomatic complexity
#   E, W -> pycodestyle (style; mostly delegated to Black)
#   F    -> pyflakes (undefined names, unused imports)
#   B    -> flake8-bugbear
#   B950 -> bugbear's Black-compatible soft line-length check
select =
    C4,
    C90,
    E,
    F,
    W,
    B,
    B950

# Cyclomatic complexity ceiling. 10 is mccabe's default; raise to 15 if
# connector or parser code legitimately exceeds it.
max-complexity = 10

# --- Exclusions ------------------------------------------------------------
# Paths are matched as POSIX-style globs. flake8 normalises path separators
# internally, so do NOT duplicate entries with Windows-style backslashes --
# they can never match and are dead config.
exclude =
    .git,
    .hg,
    .svn,
    .tox,
    .nox,
    .eggs,
    __pycache__,
    *.egg-info,
    .venv,
    venv,
    env,
    build,
    dist,
    .mypy_cache,
    .ruff_cache,
    .pytest_cache,
    .hypothesis,
    .idea,
    .vscode,
    node_modules,
    archives,
    # Vendored / legacy trees kept behind compatibility shims.
    src/huey/connectors/pyhuey,
    src/huey/memory/PY

# --- Per-file relaxations --------------------------------------------------
per-file-ignores =
    # Package __init__ files exist to re-export; F401 is the point.
    src/huey/__init__.py: F401
    # Root shim manipulates sys.path before importing huey.run.
    run.py: E402
    # CLI entry points do the same for discovery.
    src/huey/cli/*.py: E402