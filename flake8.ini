[flake8]
max-line-length = 88
extend-ignore =
    E402,
    E501
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    .mypy_cache,
    .pytest_cache,
    node_modules,
    archives,
    src/huey/connectors/pyhuey,
    src\huey\connectors\pyhuey,
    src/huey/memory/PY,
    src\huey\memory\PY
