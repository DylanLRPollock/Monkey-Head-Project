# ---------------------------------------------------------------------------
# Monkey-Head-Project
# Component: HueyOS / Pytest Configuration
# Author: Dylan L.R. Pollock
# Documentation: https://www.dlrp.ca
#
# Philosophy: Breathing new life into old tech.
# ---------------------------------------------------------------------------
#
# IMPORTANT: pytest reads exactly ONE configuration file, and `pytest.ini`
# takes precedence over `[tool.pytest.ini_options]` in pyproject.toml. If
# both files define pytest options, this file wins and the pyproject.toml
# block is silently ignored.
#
# Pick one and delete the other. The two valid end states are:
#
#   (a) Keep this file, delete `[tool.pytest.ini_options]` from
#       pyproject.toml. pyproject.toml then owns packaging + linters only.
#
#   (b) Delete this file, keep the pyproject.toml block. Everything for the
#       project lives in one file, which is the modern convention.
#
# Do not leave both in place -- the divergence is invisible until someone
# edits the pyproject.toml block, sees no effect, and spends an afternoon
# debugging it.
#
# Marker registration for `@pytest.mark.asyncio` lives in `conftest.py`
# (see `pytest_configure`), not here, so it stays next to the hook that
# implements the marker. `--strict-markers` below is what makes an
# unregistered marker fail loudly.

[pytest]
minversion = 8.0

# -ra        : show a short summary of all non-passing tests at the end.
# --strict-markers : fail on any marker not registered in conftest.py.
# --strict-config  : fail on unknown keys in this file (typos become errors).
# -p no:cacheprovider is deliberately NOT set -- the cache speeds up reruns.
addopts = -ra --strict-markers --strict-config

testpaths =
    tests

python_files =
    test_*.py
    *_test.py

python_classes =
    Test*

python_functions =
    test_*

# Turn warnings into errors by default, with narrow carve-outs for known
# upstream DeprecationWarnings. This is the setting that stops "we'll fix
# it later" warnings from accumulating into background noise.
filterwarnings =
    error
    default::DeprecationWarning:starlette.*
    default::DeprecationWarning:pydantic.*

# Show local variables in tracebacks for easier debugging.
# Add `--showlocals` to addopts if you want it on every run.
# log_cli = true
# log_cli_level = INFO