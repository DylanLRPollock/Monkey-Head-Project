name: "CodeQL Advanced (HueyOS)"

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - 'wiki/**'
      - '**/*.md'
      - 'media/**'
      - 'assets/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - 'wiki/**'
      - '**/*.md'
      - 'media/**'
      - 'assets/**'
  schedule:
    # Tuesdays at 21:16 UTC
    - cron: '16 21 * * 2'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: 120

    permissions:
      # required for all workflows
      security-events: write
      # required to fetch internal or private CodeQL packs
      packages: read
      # only required for workflows in private repositories
      actions: read
      contents: read

    concurrency:
      group: codeql-${{ github.ref }}-${{ matrix.language }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          # Uncomment if/when you add JS/TS to the repo
          # - language: javascript-typescript
          #   build-mode: none
          # CodeQL supports: actions, c-cpp, csharp, go, java-kotlin,
          # javascript-typescript, python, ruby, rust, swift

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Use the extended security queries in addition to the default set.
          queries: +security-extended,security-and-quality

      # If the analyze step fails with "We were unable to automatically build your code"
      # switch the language's build-mode above to 'manual' and add the commands here.
      - name: Run manual build steps
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo 'If you are using a "manual" build mode for one or more of the'             'languages you are analyzing, replace this with the commands to build'             'your code, for example:'
          echo '  make bootstrap'
          echo '  make release'
          exit 1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
