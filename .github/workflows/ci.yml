name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# Limit default token permissions for the workflow
permissions:
  contents: read

# Prevent overlapping runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            **/requirements*.txt
            pyproject.toml
            setup.cfg
            setup.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run drift checker
        run: make check-drift PYTHON=python

      - name: Run linters
        run: make lint PYTHON=python

  tests:
    name: Tests (Py ${{ matrix.python-version }} - ${{ matrix.track }})
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.13"
            track: supported
            experimental: false
          - python-version: "3.14"
            track: testing
            experimental: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            **/requirements*.txt
            pyproject.toml
            setup.cfg
            setup.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.experimental }}" = "true" ]; then
            # Exercise 3.14 compatibility without advertising it as supported metadata.
            pip install --ignore-requires-python -e ".[dev]"
          else
            pip install -e ".[dev]"
          fi

      - name: Run test suite with coverage
        env:
          PYTEST_ADDOPTS: "-q"
        run: make coverage PYTHON=python

      - name: Upload coverage artifacts (if present)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.track }}
          path: |
            coverage.xml
            htmlcov/**
          if-no-files-found: ignore
