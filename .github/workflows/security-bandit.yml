name: Bandit Security Scan

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.13'

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit

      - name: Verify baseline exists
        run: test -f .security/bandit-baseline.json

      - name: Record full Bandit report (debt + new)
        if: always()
        run: |
          bandit -r src -f json -o bandit-results-full.json || true

      - name: Enforce no new medium/high findings
        run: |
          bandit -r src -b .security/bandit-baseline.json -ll -ii -x src/huey/storage/hex_cluster.py

      - name: Upload Bandit JSON results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bandit-results
          path: |
            bandit-results-full.json
            .security/bandit-baseline.json
          if-no-files-found: error