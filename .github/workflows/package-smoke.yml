name: Package Smoke

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  package-smoke:
    name: Build + Install Smoke (Py ${{ matrix.python-version }} - ${{ matrix.track }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.13"
            track: supported
            experimental: false
          - python-version: "3.14"
            track: testing
            experimental: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Create fresh virtual environment
        run: python -m venv .pkg-smoke-venv

      - name: Install built wheel in fresh environment
        shell: bash
        run: |
          source .pkg-smoke-venv/bin/activate
          python -m pip install --upgrade pip
          if [ "${{ matrix.experimental }}" = "true" ]; then
            # Exercise 3.14 compatibility without promoting 3.14 to supported metadata.
            python -m pip install --ignore-requires-python dist/*.whl
          else
            python -m pip install dist/*.whl
          fi

      - name: Import smoke checks
        shell: bash
        run: |
          source .pkg-smoke-venv/bin/activate
          python -c "import huey"
          python -c "import hueyos"
          python -c "import huey.api"

      - name: Console script smoke checks
        shell: bash
        run: |
          source .pkg-smoke-venv/bin/activate
          timeout 15s huey --help
          timeout 15s huey-api --help

      - name: Upload dist artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: package-dist-artifacts-${{ matrix.python-version }}-${{ matrix.track }}
          path: dist/
