# Temporary, branch-scoped one-shot remediation. Self-deletes in its own commit.
name: One-shot Python lint remediation
on:
  push:
    branches:
      - fix/ci-lint-pygpt-integration-20261102
permissions:
  contents: write
jobs:
  rewrite:
    if: github.repository == 'DylanLRPollock/Monkey-Head-Project' && github.ref == 'refs/heads/fix/ci-lint-pygpt-integration-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
        with:
          python-version: '3.13'
      - name: Install exact repository-formatting tools
        run: python -m pip install ruff==0.17.2 black==26.10.1 isort==9.0.2
      - name: Apply safe Ruff fixes, isort and Black
        shell: bash
        run: |
          python -m ruff check --fix src tests scripts conftest.py || test "$?" -eq 1
          python -m isort --profile black src tests scripts conftest.py
          python -m black src tests scripts conftest.py
          python -m ruff check --fix src tests scripts conftest.py || test "$?" -eq 1
          python -m isort --profile black src tests scripts conftest.py
          python -m black src tests scripts conftest.py
      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/one-shot-python-lint-remediation.yml
          git add src tests scripts conftest.py
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(py313): apply safe Ruff, isort and Black autofixes'
            git push origin HEAD:fix/ci-lint-pygpt-integration-20261102
          fi
