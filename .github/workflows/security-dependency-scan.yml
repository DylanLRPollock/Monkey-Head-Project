name: Dependency Security Scan

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.13'

      - name: Install audit tooling and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          pip install -e ".[dev]"

      - name: Record pip-audit JSON output
        if: always()
        run: |
          pip-audit --format json --output pip-audit-results.json --skip-editable || true
          test -f pip-audit-results.json || printf '{"error":"pip-audit did not produce JSON output"}\n' > pip-audit-results.json

      - name: Enforce dependency security audit
        run: |
          pip-audit --skip-editable

      - name: Upload pip-audit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pip-audit-results
          path: pip-audit-results.json
          if-no-files-found: error
