logging:
  level: INFO
  file: 'memory/LOGS/app.log'

database:
  host: 'db'
  port: 5432
  user: 'postgres'
  password: '${DB_PASSWORD}'
  database: 'monkey_head'

system:
  os: 'debian-trixie'
  python_version: '3.13.5'
  python_next_version: '3.14.x (post-2025-10-31 rollout)'
  virtual_env: '/opt/venv'
  dependencies:
    - pygpt-MHP
    - docker
    - kubernetes
    - fastapi
    - redis
    - celery

app:
  environment: development
