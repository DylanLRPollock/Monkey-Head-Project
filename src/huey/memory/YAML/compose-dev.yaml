services:
  dev-env:
    container_name: monkey-head
    # Build options
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOME_ARG: "some_value"
    # Use an image if built externally (optional)
    image: monkey-head-project:latest
    # Override the default command if needed
    command: /bin/sh
    # Mount source code and additional volumes if desired
    volumes:
      - .:/workspace
      - /data:/data
    working_dir: /workspace
    environment:
      - ENV_VAR=dev
      - OTHER_VAR=value
      - APP_ENV=development
    ports:
      - "3000:3000"
      - "8000:8000"
    networks:
      - dev-network
    restart: unless-stopped
    tty: true
    stdin_open: true
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:3000"]
    interval: 30s
    timeout: 10s
    retries: 3

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: dlrp
      # Fail closed if POSTGRES_PASSWORD is missing.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - dev-network

volumes:
  db-data:

networks:
  dev-network:
    driver: bridge
